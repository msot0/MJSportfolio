<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Duel Dash</title>
    <script src="p5.js"></script>
    <script src="p5.sound.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0f1a10;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: 'Space Grotesk', Arial, sans-serif;
      }
      main { display: flex; flex-direction: column; align-items: center; }

      /* ---------- TOUCH CONTROLS ---------- */
      .touch-controls {
        display: flex;
        justify-content: space-between;
        width: 1000px;
        max-width: 100%;
        padding: 14px 20px 20px;
        box-sizing: border-box;
        gap: 20px;
      }
      .control-group {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .control-group.p2 { flex-direction: row-reverse; }

      .dpad {
        display: grid;
        grid-template-columns: 44px 44px 44px;
        grid-template-rows: 44px 44px 44px;
        gap: 4px;
      }
      .dpad button { grid-column: 2; }
      .dpad button[data-key="a"] { grid-column: 1; grid-row: 2; }
      .dpad button[data-key="d"] { grid-column: 3; grid-row: 2; }
      .dpad button[data-key="w"] { grid-row: 1; }
      .dpad button[data-key="s"] { grid-row: 3; }
      .dpad button[data-key="j"] { grid-column: 1; grid-row: 2; }
      .dpad button[data-key="l"] { grid-column: 3; grid-row: 2; }
      .dpad button[data-key="i"] { grid-row: 1; }
      .dpad button[data-key="k"] { grid-row: 3; }

      .touch-controls button {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        border: 2px solid #cfe3bf;
        background: #1f3a24;
        color: #f6f2e4;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        width: 44px;
        height: 44px;
      }
      .touch-controls button:active,
      .touch-controls button.pressed {
        background: #e0b84d;
        color: #1f3a24;
        border-color: #e0b84d;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .actions button {
        width: 70px;
        height: 40px;
        font-size: 13px;
        border-radius: 999px;
      }

      @media (max-width: 640px) {
        .touch-controls { flex-direction: column; align-items: center; }
        .control-group.p2 { flex-direction: row; }
      }
    </style>
  </head>
  <body>
    <main></main>

    <!-- On-screen touch controls: mirror the WASD/IJKL/F/H/Q/P keyboard scheme
         so the game is fully playable on phones and tablets -->
    <div class="touch-controls" id="touch-controls">
      <div class="control-group p1">
        <div class="dpad">
          <button data-key="w">▲</button>
          <button data-key="a">◀</button>
          <button data-key="s">▼</button>
          <button data-key="d">▶</button>
        </div>
        <div class="actions">
          <button data-key="f">Jump</button>
          <button data-key="q">Swap</button>
        </div>
      </div>
      <div class="control-group p2">
        <div class="dpad">
          <button data-key="i">▲</button>
          <button data-key="j">◀</button>
          <button data-key="k">▼</button>
          <button data-key="l">▶</button>
        </div>
        <div class="actions">
          <button data-key="h">Jump</button>
          <button data-key="p">Swap</button>
        </div>
      </div>
    </div>

    <script src="sketch.js"></script>
    <script src="touch-controls.js"></script>
  </body>
</html>
